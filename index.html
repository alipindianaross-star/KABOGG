<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reaction Time Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- White Flash Overlay -->
    <div id="flash"></div>

    <!-- Start Screen -->
    <div id="startScreen">
        <button id="playBtn">PLAY</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p id="highestScoreDisplay">Highest Score: 0</p>
        <p id="finalScore">Score: 0</p>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>

    <!-- HUD -->
    <div id="score">Score: 0</div>
    <div id="lives">Lives: ❤️❤️❤️</div>
    <div id="highScore">Highest Score: 0</div>

    <!-- Game Object -->
    <div id="circle"></div>

    <!-- Background Music -->
    <audio id="bgMusic" src="audiofilee.mp3" preload="auto" loop></audio>

    <!-- Jumpscare Audio -->
    <audio id="jumpscareAudio" src="audiofile.mp3" preload="auto"></audio>

    <script src="Fnalproject.js"></script>
</body>
</html>
